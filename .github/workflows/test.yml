name: CI

# The trigger: when does this workflow run?
on:
  pull_request:
    branches:
      - main

jobs:
  build:
    # The machine GitHub gives us for the run
    runs-on: ubuntu-latest

    # OPTION A: run every step inside a Docker container.
    # It pins Node, but GitHub has to pull the image each run (~30s),
    # and there is no npm cache.
    # container:
    #   image: node:24

    steps:
      # Download our repo's code onto the machine
      - name: Check out code
        uses: actions/checkout@v4

      # OPTION B (used here): install Node directly, with npm caching.
      # Same Node version as the container, but faster on repeat runs.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Install exactly what package-lock.json lists
      - name: Install dependencies
        run: npm ci

      - name: Test 
        run: npm test

      # Check that the app compiles
      - name: Build
        run: npm run build
